<!doctype html>
<html lang="en">
  <head>
    <title>AntonBlast - wasm.rip</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0d0d0d;
        color: #e5e5e5;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
        font-size: 1.44em;
        min-height: 100vh;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 38px;
      }
      nav {
        border-bottom: 1px solid #333;
        background: #111;
      }
      nav .container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 38px;
      }
      nav span {
        color: #ccc;
      }
      nav a {
        color: #aaa;
        text-decoration: none;
        font-size: 17.5px;
      }
      nav a:hover {
        color: #fff;
      }
      h1 {
        font-size: 44px;
        margin-bottom: 8px;
      }
      .tagline {
        color: #888;
        margin-bottom: 38px;
        font-size: 17.5px;
      }
      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
      }
      .game-card {
        display: flex;
        flex-direction: column;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
      }
      .game-card:hover {
        transform: scale(1.02);
        border-color: #555;
      }
      .game-card img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #000;
        border-bottom: 1px solid #333;
      }
      .game-card .game-info {
        padding: 18px;
      }
      .game-card .game-title {
        font-size: 22px;
        font-weight: bold;
      }
      .game-card .game-desc {
        margin-top: 8px;
        color: #aaa;
        font-size: 16px;
      }
      footer {
        border-top: 1px solid #333;
        margin-top: 80px;
        padding: 25px 0;
        font-size: 16px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="container">
        <span>wasm.rip</span>
        <a href="../../">back to ports</a>
      </div>
    </nav>

    <main>
      <div class="container">
        <h1>AntonBlast Loader</h1>
        <p class="tagline">I kinda ported 2 so just pick one</p>

        <div class="game-grid" id="game-grid"></div>
      </div>
    </main>

    <footer>
      <div class="container">ports by @turg1991 on discord</div>
    </footer>

    <script>
      const games = [
        {
          name: "AntonBlast",
          imageUrl: "antonblast.jpg",
          url: "antonblast/runner.html",
          desc: "the original GameMaker game (only current issue is the game being offset in its window so you have to change the window settings in-game",
        },
        {
          name: "AntonBlast 64",
          imageUrl: "antonblast64.jpg",
          url: "antonblast64/index.html",
          desc: "some 3D remake made in Godot",
        },
      ];

      const grid = document.getElementById("game-grid");

      games.forEach((game) => {
        const card = document.createElement("div");
        card.classList.add("game-card");

        const img = document.createElement("img");
        img.src = game.imageUrl;
        img.alt = game.name;

        const info = document.createElement("div");
        info.classList.add("game-info");

        const title = document.createElement("div");
        title.classList.add("game-title");
        title.textContent = game.name;

        const desc = document.createElement("div");
        desc.classList.add("game-desc");
        desc.textContent = game.desc;

        info.appendChild(title);
        info.appendChild(desc);
        card.appendChild(img);
        card.appendChild(info);

        card.addEventListener("click", () => {
          window.open(game.url, "_blank");
        });

        grid.appendChild(card);
      });
    </script>
  </body>
</html>
